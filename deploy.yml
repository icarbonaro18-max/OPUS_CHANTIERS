name: Publier OPUS CHANTIERS

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      artifact_name: ${{ steps.package.outputs.name }}
      artifact_id: ${{ steps.upload.outputs.artifact_id }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm

      - name: Installer les composants
        run: npm ci --no-audit --no-fund

      # npm test lance aussi la compilation via pretest.
      - name: Construire et tester OPUS CHANTIERS
        run: npm test

      - id: package
        run: echo "name=github-pages-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_OUTPUT"

      - name: Envoyer le site compilé
        id: upload
        uses: actions/upload-pages-artifact@v5
        with:
          name: ${{ steps.package.outputs.name }}
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      actions: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v6

      - name: Attendre que GitHub retrouve l’archive de cette compilation
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_ID: ${{ needs.build.outputs.artifact_id }}
          ARTIFACT_NAME: ${{ needs.build.outputs.artifact_name }}
        run: |
          test -n "$EXPECTED_ID"
          endpoint="repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts?name=$ARTIFACT_NAME"
          for delay in 0 2 4 8 16 30; do
            sleep "$delay"
            found=$(gh api "$endpoint" --jq '.artifacts[] | select(.expired == false) | .id') || continue
            if [[ "$found" == "$EXPECTED_ID" ]]; then exit 0; fi
          done
          echo "::error::GitHub ne trouve pas l’archive $ARTIFACT_NAME (ID $EXPECTED_ID). Relancez le job de publication."
          exit 1

      - name: Publier le site
        id: deploy
        uses: actions/deploy-pages@v5
        with:
          artifact_name: ${{ needs.build.outputs.artifact_name }}
