<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="referrer" content="no-referrer">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Connexion Microsoft · OPUS CHANTIERS</title>
</head>
<body>
  <p id="status">Connexion Microsoft en cours…</p>
  <script type="module">
    import {broadcastResponseToMainFrame} from './vendor/msal-bridge.js';
    // MSAL 5: the bridge returns silent/popup responses to their requesting
    // window and redirects interactive responses to the original app page.
    // Do not initialize MSAL, load the app, or navigate this page ourselves.
    broadcastResponseToMainFrame().catch(error=>{
      console.error('Réponse Microsoft non transmise',error);
      document.getElementById('status').textContent='La connexion n’a pas abouti. Revenez à OPUS CHANTIERS et réessayez.';
    });
  </script>
</body>
</html>
